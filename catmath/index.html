<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>🐱 猫猫数学 - 北师大版1-6年级练习</title>
  <link rel="stylesheet" href="css/katex.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .quiz-start { text-align: center; padding: 20px 0; }
    .quiz-start h3 { font-size: 18px; margin-bottom: 12px; color: var(--text); }
    .start-btn {
      padding: 16px 40px;
      border: none;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 8px;
    }
    .start-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .quick-quiz-btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 24px;
      border: 2px solid var(--primary-light);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .quick-quiz-btn:hover { background: #f0edff; }
  </style>
</head>
<body>
  <div class="app-container">

    <!-- 首页 -->
    <div id="page-home" class="page active">
      <div class="header">
        <h1>🐱 猫猫数学</h1>
        <p>北师大版 · 小学1-6年级数学练习</p>
      </div>

      <div class="stats-bar">
        <div class="stat-card">
          <div class="stat-number" id="stat-correct">0</div>
          <div class="stat-label">正确题数</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-total">0</div>
          <div class="stat-label">总答题数</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-accuracy">0%</div>
          <div class="stat-label">正确率</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-wrong">0</div>
          <div class="stat-label">错题数</div>
        </div>
      </div>

      <div class="nav-buttons">
        <button class="nav-btn accent" onclick="MathApp.App.showWrong()">📝 错题本</button>
        <button class="nav-btn outline" onclick="MathApp.App.showProgress()">📊 学习进度</button>
      </div>

      <div class="grade-grid" id="grade-grid"></div>
    </div>

    <!-- 年级页面 -->
    <div id="page-grade" class="page">
      <button class="back-btn" onclick="MathApp.App.goHome()">← 返回首页</button>
      <h2 id="grade-title" class="practice-title" style="margin-bottom:16px"></h2>

      <div style="margin-bottom:12px;">
        <button class="quick-quiz-btn" id="quick-quiz-grade-btn">🎯 年级综合测验（随机10题）</button>
      </div>

      <div class="semester-tabs" id="semester-tabs"></div>
      <div class="topic-list" id="topic-list"></div>
    </div>

    <!-- 练习页面 -->
    <div id="page-practice" class="page">
      <button class="back-btn" onclick="MathApp.App.goHome()">← 退出练习</button>
      <div class="practice-header">
        <div class="practice-title" id="practice-title"></div>
        <div class="question-count" id="question-counter"></div>
      </div>
      <div class="question-card">
        <div class="question-text" id="question-text"></div>
        <div id="answer-area"></div>
      </div>
      <div class="feedback-area" id="feedback-area" style="display:none"></div>
    </div>

    <!-- 结果页面 -->
    <div id="page-result" class="page">
      <div class="result-card">
        <div style="font-size:48px;margin-bottom:8px">🏆</div>
        <div style="font-size:18px;color:var(--text-light)">练习完成</div>
        <div class="result-score" id="result-score">0%</div>
        <div class="result-label" id="result-label"></div>
        <div class="result-details">
          <div class="result-detail">
            <div class="num correct-num" id="correct-num">0</div>
            <div class="label">正确</div>
          </div>
          <div class="result-detail">
            <div class="num wrong-num" id="wrong-num">0</div>
            <div class="label">错误</div>
          </div>
        </div>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
          <button class="nav-btn primary" onclick="MathApp.App.selectTopic(MathApp.App._getCurrentTopicId())">再做一组</button>
          <button class="nav-btn outline" onclick="MathApp.App.goHome()">返回首页</button>
        </div>
      </div>
    </div>

    <!-- 错题本页面 -->
    <div id="page-wrong" class="page">
      <button class="back-btn" onclick="MathApp.App.goHome()">← 返回首页</button>
      <div class="wrong-page-header">
        <h2>📝 错题本</h2>
        <span class="wrong-count-badge" id="wrong-count-badge">0题</span>
      </div>
      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
        <button class="nav-btn accent" onclick="MathApp.App.retryWrong()">🔄 错题重练</button>
        <button class="nav-btn danger" onclick="MathApp.App.clearWrong()">🗑️ 清空错题</button>
      </div>
      <div id="wrong-list-container"></div>
    </div>

    <!-- 学习进度页面 -->
    <div id="page-progress" class="page">
      <button class="back-btn" onclick="MathApp.App.goHome()">← 返回首页</button>
      <h2 style="margin-bottom:16px">📊 学习进度</h2>
      <div class="progress-page">
        <div class="progress-grid" id="progress-container"></div>
      </div>
    </div>

  </div>

  <div class="cat-mascot" title="点我有惊喜～">🐱</div>

  <script src="js/katex.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    MathApp.App._getCurrentTopicId = function () {
      return currentTopic ? currentTopic.id : "";
    };

    document.getElementById("quick-quiz-grade-btn").addEventListener("click", function () {
      if (currentGrade) {
        MathApp.App.startQuickQuiz(currentGrade.id, 10);
      }
    });

    MathApp.App.init();
  </script>
</body>
</html>
